# Dependency licence policy, enforced by `just check`.
#
# The project is MIT. A dependency has to leave it that way: permissive
# licences, and copyleft only where it stops at the file (MPL-2.0, which is
# libcosmic's). GPL and AGPL crates are out, which is why the event store is
# nostr-lmdb rather than nostr-ndb (nostrdb is GPL-3.0-or-later), and why the
# allow list is explicit rather than "whatever cargo found".

[licenses]
allow = [
    "MIT",
    "MPL-2.0",           # libcosmic; file-level copyleft
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",       # unicode-ident and friends
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",  # webpki-roots: a certificate bundle, not code
]

# Crates whose manifests carry no `license` field at all. All are pop-os
# workspace members published only as git dependencies; the licence recorded
# here is the one in the repository they ship from, not a guess about intent.
[[licenses.clarify]]
crate = "cosmic-config"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "cosmic-config-derive"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "cosmic-theme"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "cosmic-panel-config"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "cosmic-settings-daemon"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "xdg-shell-wrapper-config"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "iced_accessibility"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "dnd"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "mime"
expression = "MIT"
license-files = []
