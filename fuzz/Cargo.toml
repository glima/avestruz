[package]
name = "cosmic-applet-avestruz-fuzz"
version = "0.1.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Its own workspace, with its own lockfile. Without this, cargo looks for
# one in the directories above and can claim fuzz/ for an unrelated
# workspace, e.g. when this checkout sits inside another one.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
# The address a linked page was fetched from, as the library takes it.
url = "2"

[dependencies.cosmic-applet-avestruz]
path = ".."
default-features = false

[[bin]]
name = "fuzz_note_content"
path = "fuzz_targets/fuzz_note_content.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_link_preview"
path = "fuzz_targets/fuzz_link_preview.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_relay_info"
path = "fuzz_targets/fuzz_relay_info.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_attached_file"
path = "fuzz_targets/fuzz_attached_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_youtube_link"
path = "fuzz_targets/fuzz_youtube_link.rs"
test = false
doc = false
bench = false
