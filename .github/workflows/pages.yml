name: Project site

# Publishes site/ (with the icon from resources/) to GitHub Pages at
# https://glima.github.io/avestruz/, and under doc/ there the documentation
# `just doc` builds from the source. `just site` assembles both, the same
# recipe used to preview them locally. The scene's props and its still
# picture are in the repository as files: making them takes tools a runner
# does not have (see site/craft/README.md).
on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "resources/icon.svg"
      - "justfile"
      - ".github/workflows/pages.yml"
      # What the documentation is built from.
      - "src/**"
      - "docs/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  # Refresh the download links once a release has published its files.
  # (`release: published` never fires here: the Release workflow creates
  # releases with GITHUB_TOKEN, which does not trigger other workflows.)
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions: read-all

# One deployment at a time; a newer push supersedes a queued one, but a
# deployment already under way is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A site published from a private repository is public all the same,
    # where the plan allows it at all: nothing is published until the
    # repository is.
    if: >-
      github.event.repository.private == false &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What the crates link against: rustdoc builds the crate's dependencies
      # as far as their metadata before it documents it.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: pages-doc
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }} # read the latest release's file list
        run: just site _site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the uploaded site
      id-token: write # prove to Pages that this run is the deployer
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
