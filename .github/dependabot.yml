version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Main crate. libcosmic, a git dependency, is held at the revision it was
  # built and tried against and moved by hand (`cargo update -p libcosmic`):
  # left to Dependabot it is moved to the tip of its branch every week.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "libcosmic"

  # The cargo-fuzz harness is a *separate* workspace, so its lockfile isn't
  # touched by the main `cargo update` and drifts: stale entries then trip
  # Dependabot's security scan. Have Dependabot keep it current instead.
  # Dev-only; never ships in the applet.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # At the revision the main crate is at: see above.
      - dependency-name: "libcosmic"
