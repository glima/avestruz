version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # The parts of one action, used together in a job: CodeQL refuses to
      # run with `init` and `analyze` at different versions, so they move
      # in one pull request or not at all.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  # Main crate. libcosmic, a git dependency, is held at the revision it was
  # built and tried against and moved by hand (`cargo update -p libcosmic`):
  # left to Dependabot it is moved to the tip of its branch every week.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "libcosmic"
      # The WebSocket crate `nostr-sdk` builds with: ours has to be the same
      # one, and moves when `nostr-sdk` moves it.
      - dependency-name: "tokio-tungstenite"

  # The cargo-fuzz harness is a *separate* workspace, so its lockfile isn't
  # touched by the main `cargo update` and drifts: stale entries then trip
  # Dependabot's security scan. Have Dependabot keep it current instead.
  # Dev-only; never ships in the applet.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # At the revision the main crate is at: see above.
      - dependency-name: "libcosmic"
      - dependency-name: "tokio-tungstenite"

  # What the website is built with (three.js, esbuild, glTF Transform).
  # Never ships in the applet.
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
